name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/niet-main/niet-pharmacy-website-2026
      APP_DIR: /docker/niet-pharmacy-dev
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
      - name: Deploy to VPS
        env:
          SSH: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes deploy/docker-compose.yml "$TARGET:$APP_DIR/docker-compose.yml"
          echo "${{ secrets.GITHUB_TOKEN }}" | $SSH "$TARGET" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          $SSH "$TARGET" "cd $APP_DIR && TAG=${{ github.sha }} docker compose pull && TAG=${{ github.sha }} docker compose up -d --remove-orphans"
          for i in $(seq 1 12); do
            status=$($SSH "$TARGET" "docker inspect -f '{{.State.Health.Status}}' niet-pharmacy-dev" || true)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 10
          done
          echo "deploy did not become healthy" >&2; exit 1
